<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>菜单管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    var _vueOk = false, _axiosOk = false, _queue = []
    function _tryCDN(name, urls, i) {
      if (i >= urls.length) return
      var s = document.createElement('script')
      s.src = urls[i]
      s.onload = function() { if (name === 'vue') _vueOk = true; else _axiosOk = true; while (_queue.length && _vueOk && _axiosOk) _queue.shift()() }
      s.onerror = function() { _tryCDN(name, urls, i+1) }
      document.head.appendChild(s)
    }
    _tryCDN('vue', ['https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.13/vue.global.prod.js','https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js','https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js'], 0)
    _tryCDN('axios', ['https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.9/axios.min.js','https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js','https://unpkg.com/axios@1.7.9/dist/axios.min.js'], 0)
    setTimeout(function() {
      if (!_vueOk || !_axiosOk) {
        var el = document.getElementById('app')
        if (el) el.innerHTML = '<div style="padding:40px;text-align:center;font-size:14px;"><p style="color:red;">依赖加载失败</p><p style="color:#999;margin-top:8px;">请检查网络连接后 <a href="#" onclick="location.reload()" style="color:#3b82f6;">刷新页面</a></p></div>'
      }
    }, 15000)
  </script>
</head>
<body>
  <script id="tpl" type="text/x-template">
    <template v-if="viewGranted">
    <div class="min-h-screen bg-gray-50 font-sans text-gray-700">
      <template v-if="viewMode === 'list'">
        <div class="max-w-7xl mx-auto p-6">
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 border-t-2 border-t-blue-500 p-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-gray-800 tracking-tight">菜单管理</h2>
              <button v-if="actions.includes('create')" @click="doCreate" class="inline-flex items-center gap-1.5 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors duration-200 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                New
              </button>
            </div>

            <div class="border border-gray-200 rounded-lg overflow-hidden mb-4">
              <div @click="showSearch = !showSearch" class="flex items-center gap-2 px-4 py-2.5 bg-gray-50 cursor-pointer select-none hover:bg-gray-100 transition-colors duration-200 text-sm font-medium text-gray-600">
                <svg class="w-3 h-3 transition-transform duration-200" :class="showSearch ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                搜索条件
              </div>
              <div v-show="showSearch" class="px-4 py-3 border-t border-gray-200">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  <div><label class="block text-xs text-gray-500 mb-1">关键字</label><input v-model="sf.keyword" placeholder="菜单名称" @keyup.enter="search" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200" /></div>
                  <div><label class="block text-xs text-gray-500 mb-1">状态</label>
                    <select v-model="sf.status" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 bg-white">
                      <option value="">全部</option>
                      <option value="active">启用</option>
                      <option value="inactive">停用</option>
                    </select>
                  </div>
                  <div class="flex items-end gap-2">
                    <button @click="clear" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors duration-200">清除</button>
                    <button @click="search" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors duration-200 shadow-sm">搜索</button>
                  </div>
                </div>
              </div>
            </div>

            <div v-if="loading" class="text-center py-12"><div class="inline-block w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>

            <div v-if="!loading" class="overflow-x-auto rounded-lg border border-gray-200">
              <table class="w-full text-sm">
                <thead>
                  <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                    <th class="px-4 py-3 text-center w-12">#</th>
                    <th class="px-4 py-3 text-left">菜单名称</th>
                    <th class="px-4 py-3 text-left">页面标题</th>
                    <th class="px-4 py-3 text-left">页面路径</th>
                    <th class="px-4 py-3 text-center">排序</th>
                    <th class="px-4 py-3 text-center">分隔线</th>
                    <th class="px-4 py-3 text-center">状态</th>
                    <th class="px-4 py-3 text-left">创建时间</th>
                    <th class="px-4 py-3 text-center w-36">操作</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  <tr v-for="(row, i) in list" :key="row.id" class="hover:bg-blue-50 cursor-pointer transition-colors duration-200">
                    <td class="px-4 py-3 text-center text-gray-400 tabular-nums">{{ (pg.page - 1) * pg.size + i + 1 }}</td>
                    <td class="px-4 py-3"><span class="text-blue-600 hover:text-blue-800 font-medium cursor-pointer" @click="doDetail(row)">{{ row.label }}</span></td>
                    <td class="px-4 py-3 text-gray-500">{{ row.pageTitle || '-' }}</td>
                    <td class="px-4 py-3 text-gray-500">{{ row.pageSrc || '-' }}</td>
                    <td class="px-4 py-3 text-center tabular-nums">{{ row.sortOrder }}</td>
                    <td class="px-4 py-3 text-center">{{ row.isDivider ? '是' : '否' }}</td>
                    <td class="px-4 py-3 text-center"><span :class="statusClass(row.status)" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">{{ statusLabel(row.status) }}</span></td>
                    <td class="px-4 py-3 text-gray-500 tabular-nums">{{ row.createdAt }}</td>
                    <td class="px-4 py-3 text-center">
                      <button v-if="actions.includes('edit')" @click.stop="doDetail(row)" class="text-blue-600 hover:text-blue-800 text-xs font-medium transition-colors duration-200">Edit</button>
                      <button v-if="actions.includes('delete')" @click.stop="doDelete(row)" class="text-red-500 hover:text-red-700 text-xs font-medium ml-3 transition-colors duration-200">Delete</button>
                      <button v-if="actions.includes('toggle_status') && row.status === 'active'" @click.stop="doToggleStatus(row, 'inactive')" class="text-amber-600 hover:text-amber-800 text-xs font-medium ml-3 transition-colors duration-200">Disable</button>
                      <button v-if="actions.includes('toggle_status') && row.status !== 'active'" @click.stop="doToggleStatus(row, 'active')" class="text-emerald-600 hover:text-emerald-800 text-xs font-medium ml-3 transition-colors duration-200">Enable</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div v-if="list.length === 0 && !loading" class="text-center py-12 text-gray-400 text-sm">未找到符合条件的数据。</div>
            </div>

            <div v-if="total > 0" class="flex items-center justify-between mt-4 pt-4 border-t border-gray-100">
              <div class="text-sm text-gray-500">共 <span class="font-medium text-gray-700">{{ total }}</span> 条</div>
              <div class="flex items-center gap-2 text-sm">
                <select v-model="pg.size" @change="search" class="px-2 py-1.5 border border-gray-300 rounded-lg text-sm outline-none bg-white">
                  <option :value="10">10条/页</option>
                  <option :value="20">20条/页</option>
                  <option :value="50">50条/页</option>
                  <option :value="100">100条/页</option>
                </select>
                <button :disabled="pg.page <= 1" @click="pg.page--;doFetch()" :class="pg.page <= 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100'" class="px-3 py-1.5 border border-gray-300 rounded-lg transition-colors duration-200 font-medium">上一页</button>
                <span class="px-2 text-gray-600 font-medium">{{ pg.page }} / {{ totalPages }}</span>
                <button :disabled="pg.page >= totalPages" @click="pg.page++;doFetch()" :class="pg.page >= totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-100'" class="px-3 py-1.5 border border-gray-300 rounded-lg transition-colors duration-200 font-medium">下一页</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template v-else>
        <div class="max-w-3xl mx-auto p-6">
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 border-t-2 border-t-blue-500 p-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-gray-800 tracking-tight">{{ editMode === 'create' ? '新建菜单' : '菜单详情' }}</h2>
              <div class="flex gap-2">
                <button @click="doBack" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors duration-200">返回</button>
                <button v-if="editMode !== 'view'" @click="doSave" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors duration-200 shadow-sm">保存</button>
                <button v-if="editMode === 'view' && actions.includes('edit')" @click="switchEdit" class="px-4 py-2 border border-blue-300 text-blue-600 text-sm rounded-lg hover:bg-blue-50 transition-colors duration-200">Edit</button>
                <button v-if="editMode !== 'create'" @click="doCancel" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors duration-200">取消</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-x-6 gap-y-4 text-sm">
              <div><span class="text-gray-400 text-xs">菜单ID</span><p class="font-medium mt-0.5">{{ f.id || '-' }}</p></div>
              <div><span class="text-gray-400 text-xs"><span class="text-red-500">*</span> 菜单名称</span>
                <input v-model="f.label" placeholder="请输入菜单名称" :disabled="!editable" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-400" />
              </div>
              <div class="col-span-2"><span class="text-gray-400 text-xs">图标 (SVG)</span>
                <textarea v-model="f.icon" placeholder="粘贴SVG图标代码" :disabled="!editable" rows="2" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-400 font-mono text-xs"></textarea>
                <div v-if="f.icon" class="mt-1 flex items-center gap-2 text-xs text-gray-400">
                  <span>预览:</span>
                  <span v-html="f.icon" class="w-5 h-5 text-gray-600 inline-block"></span>
                </div>
              </div>
              <div><span class="text-gray-400 text-xs">页面标题</span>
                <input v-model="f.pageTitle" placeholder="页面标题（显示在顶栏）" :disabled="!editable" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-400" />
              </div>
              <div><span class="text-gray-400 text-xs">页面路径</span>
                <input v-model="f.pageSrc" placeholder="页面HTML文件名，如 user.html" :disabled="!editable" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-400" />
              </div>
              <div><span class="text-gray-400 text-xs">排序号</span>
                <input v-model.number="f.sortOrder" type="number" placeholder="数字越小越靠前" :disabled="!editable" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 disabled:bg-gray-50 disabled:text-gray-400" />
              </div>
              <div><span class="text-gray-400 text-xs">分隔线</span>
                <div class="mt-1.5"><label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" v-model="f.isDivider" :disabled="!editable" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" /><span class="text-sm">{{ f.isDivider ? '是（作为分组标题）' : '否（普通菜单项）' }}</span></label></div>
              </div>
              <div><span class="text-gray-400 text-xs">状态</span>
                <select v-model="f.status" :disabled="!editable" class="mt-0.5 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 bg-white disabled:bg-gray-50">
                  <option value="active">启用</option>
                  <option value="inactive">停用</option>
                </select>
              </div>
              <div><span class="text-gray-400 text-xs">创建时间</span><p class="mt-0.5 tabular-nums" v-text="f.createdAt || '-'"></p></div>
              <div><span class="text-gray-400 text-xs">更新时间</span><p class="mt-0.5 tabular-nums" v-text="f.updatedAt || '-'"></p></div>
            </div>
          </div>
        </div>
      </template>

      <div v-if="cv" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="cCancel">
        <div class="bg-white rounded-xl shadow-xl p-6 min-w-[360px]">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0"><svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
            <h3 class="text-base font-semibold text-gray-800">确认操作</h3>
          </div>
          <p class="text-sm text-gray-600 mb-6 ml-11">{{ cv }}</p>
          <div class="flex justify-end gap-2">
            <button @click="cCancel" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors duration-200">取消</button>
            <button @click="cOk" class="px-4 py-2 bg-red-600 text-white text-sm rounded-lg hover:bg-red-700 transition-colors duration-200 shadow-sm">确定</button>
          </div>
        </div>
      </div>

      <div v-if="sv" class="fixed bottom-4 right-4 px-5 py-2.5 bg-gray-800 text-white text-sm rounded-lg shadow-lg z-50 transition-all duration-300">{{ sv }}</div>
    </div>
  </template>
  <template v-else>
    <div class="min-h-screen flex items-center justify-center bg-gray-50 text-gray-400 text-sm p-6">
      No permission to view this page.
    </div>
  </template>
</script>

  <div id="app"><menu-page></menu-page></div>
  <script>
    ;(function boot(){
      if (!_vueOk || !_axiosOk) { _queue.push(boot); return }
      if (!localStorage.getItem('auth_token')) { window.location.href = 'login.html'; return }

      const { ref, reactive, computed, onMounted, createApp } = Vue
      const api = axios.create({ baseURL: 'http://localhost:9090/api/v1', timeout: 10000, headers: { 'Content-Type': 'application/json' } })
      api.interceptors.request.use(cfg => { var t = localStorage.getItem('auth_token'); if (t) cfg.headers.Authorization = 'Bearer ' + t; return cfg })
      api.interceptors.response.use(function(r){return r}, function(e){ if (e.response && e.response.status === 401) { localStorage.removeItem('auth_token'); window.location.href = 'login.html' }; return Promise.reject(e) })

      const MENU_ID = new URLSearchParams(window.location.search).get('menuId') || 'm010'
      var statusConf = { active: { label: '启用', cls: 'bg-emerald-100 text-emerald-700' }, inactive: { label: '停用', cls: 'bg-gray-100 text-gray-600' } }

      createApp({
        components: { MenuPage: { template: document.getElementById('tpl').innerHTML, setup() {
          const loading = ref(false)
          const viewMode = ref('list')
          const editMode = ref('view')
          const editable = computed(() => editMode.value !== 'view')
          const actions = ref([])
          const viewGranted = ref(true)
          const showSearch = ref(true)
          const sf = reactive({ keyword: '', status: '' })
          const pg = reactive({ page: 1, size: 20 })
          const total = ref(0)
          const totalPages = computed(() => Math.max(1, Math.ceil(total.value / pg.size)))
          const list = ref([])
          const f = reactive({ id: '', label: '', icon: '', pageTitle: '', pageSrc: '', sortOrder: 0, isDivider: false, status: 'active', createdAt: '', updatedAt: '' })
          const sv = ref('')
          let st = null
          const toast = (msg) => { sv.value = msg; if (st) clearTimeout(st); st = setTimeout(() => sv.value = '', 3000) }
          const cv = ref('')
          let cr = null
          const confirm = (msg) => new Promise(r => { cv.value = msg; cr = r })
          const cOk = () => { cr?.(true); cv.value = ''; cr = null }
          const cCancel = () => { cr?.(false); cv.value = ''; cr = null }

          async function doFetch() {
            loading.value = true
            try {
              const res = await api.get('/menus', { params: { keyword: sf.keyword || undefined, status: sf.status || undefined, page: pg.page, size: pg.size } })
              var body = res.data
              total.value = body.total ?? 0
              list.value = body.content ?? []
            } catch (e) {
              if (e.response?.status !== 401) toast('获取菜单列表失败')
            } finally { loading.value = false }
          }

          function search() { pg.page = 1; doFetch() }
          function clear() { Object.assign(sf, { keyword: '', status: '' }); pg.page = 1 }

          async function doDetail(row) {
            editMode.value = 'view'; viewMode.value = 'edit'
            try {
              var res = await api.get('/menus/' + row.id)
              var d = res.data
              Object.assign(f, { id: d.id, label: d.label, icon: d.icon || '', pageTitle: d.pageTitle || '', pageSrc: d.pageSrc || '', sortOrder: d.sortOrder ?? 0, isDivider: !!d.isDivider, status: d.status, createdAt: d.createdAt, updatedAt: d.updatedAt })
            } catch (e) { toast('获取菜单详情失败'); doBack() }
          }

          function doCreate() {
            editMode.value = 'create'; viewMode.value = 'edit'
            Object.assign(f, { id: '', label: '', icon: '', pageTitle: '', pageSrc: '', sortOrder: 0, isDivider: false, status: 'active', createdAt: '', updatedAt: '' })
          }

          function switchEdit() { editMode.value = 'edit' }

          function validate() {
            if (!f.label) return toast('菜单名称不能为空')
            return true
          }

          async function doSave() {
            if (!validate()) return
            try {
              if (editMode.value === 'create') {
                await api.post('/menus', { label: f.label, icon: f.icon || undefined, pageTitle: f.pageTitle || undefined, pageSrc: f.pageSrc || undefined, sortOrder: f.sortOrder, isDivider: f.isDivider, status: f.status })
              } else {
                await api.put('/menus/' + f.id, { label: f.label, icon: f.icon || undefined, pageTitle: f.pageTitle || undefined, pageSrc: f.pageSrc || undefined, sortOrder: f.sortOrder, isDivider: f.isDivider, status: f.status, updatedAt: f.updatedAt })
              }
              toast('保存成功'); doBack(); try { window.parent.postMessage({ type: 'refreshMenus' }, '*') } catch(e) {}
            } catch (e) {
              if (e.response?.status === 401) return
              var msg = e.response?.data?.message || '保存失败'
              toast(msg)
            }
          }

          function doCancel() {
            if (editMode.value === 'create') { doBack(); return }
            confirm('放弃当前修改？').then(ok => { if (ok) { if (f.id) doDetail(list.value.find(i => i.id === f.id) || f); editMode.value = 'view' } })
          }

          function doBack() { viewMode.value = 'list'; editMode.value = 'view'; doFetch() }

          async function doDelete(row) {
            var ok = await confirm('确认删除菜单「' + row.label + '」？')
            if (!ok) return
            try {
              var detailRes = await api.get('/menus/' + row.id)
              await api.delete('/menus/' + row.id, { params: { updatedAt: detailRes.data.updatedAt } })
              toast('删除成功'); doFetch(); try { window.parent.postMessage({ type: 'refreshMenus' }, '*') } catch(e) {}
            } catch (e) {
              if (e.response?.status === 401) return
              if (e.response?.data?.code === 'E9409') toast('数据已被其他用户修改，请刷新后重试')
              else toast(e.response?.data?.message || '删除失败')
            }
          }

          async function doToggleStatus(row, targetStatus) {
            var label = targetStatus === 'active' ? '启用' : '停用'
            var ok = await confirm('确认' + label + '菜单「' + row.label + '」？')
            if (!ok) return
            try {
              var detailRes = await api.get('/menus/' + row.id)
              await api.patch('/menus/' + row.id + '/status', null, { params: { status: targetStatus, updatedAt: detailRes.data.updatedAt } })
              toast(label + '成功'); doFetch()
              try { window.parent.postMessage({ type: 'refreshMenus' }, '*') } catch(e) {}
            } catch (e) {
              if (e.response?.status === 401) return
              if (e.response?.data?.code === 'E9409') toast('数据已被其他用户修改，请刷新后重试')
              else toast(e.response?.data?.message || label + '失败')
            }
          }

          async function fetchActions() {
            try { var r = await api.get('/permissions/my-actions/' + MENU_ID); actions.value = r.data ?? []; if (!actions.value.includes('view')) viewGranted.value = false } catch(e) {}
          }

          onMounted(() => { doFetch(); fetchActions() })

          return { loading, viewMode, editMode, editable, showSearch, sf, pg, total, totalPages, list, f, sv, cv, actions, viewGranted, statusLabel: s => statusConf[s]?.label || s, statusClass: s => statusConf[s]?.cls || 'bg-gray-100 text-gray-500', doFetch, search, clear, doCreate, doDetail, switchEdit, doSave, doCancel, doBack, doDelete, doToggleStatus, cOk, cCancel }
          }
        }
      }
      }).mount('#app')
    })()
  </script>
</body>
</html>
