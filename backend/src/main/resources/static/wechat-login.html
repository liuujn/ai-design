<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信扫码登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 16px; padding: 48px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); text-align: center; max-width: 420px; width: 100%; }
        .title { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #999; margin-bottom: 32px; }
        .qr-wrapper { width: 280px; height: 280px; margin: 0 auto 24px; border: 1px solid #e8e8e8; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #fafafa; }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .qr-placeholder { color: #bbb; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .qr-placeholder .icon { font-size: 64px; }
        .tip { font-size: 13px; color: #666; margin-bottom: 24px; line-height: 1.6; }
        .btn { padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #07c160; color: #fff; }
        .btn-primary:hover { background: #06ad56; }
        .btn-outline { background: #fff; color: #333; border: 1px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; }
        .status.info { background: #e3f2fd; color: #1565c0; }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        .status.error { background: #fce4ec; color: #c62828; }
        .hidden { display: none !important; }
        .success-box { margin-top: 20px; padding: 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; text-align: left; }
        .success-box .label { font-size: 12px; color: #666; }
        .success-box .value { font-size: 14px; color: #1a1a1a; font-weight: 600; margin: 4px 0 12px; word-break: break-all; font-family: monospace; }
        .countdown { font-size: 12px; color: #999; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">微信扫码登录</div>
        <div class="subtitle">请使用微信扫描二维码</div>

        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrPlaceholder">
                <div class="qr-placeholder">
                    <div class="icon">📱</div>
                    <span>点击下方按钮生成二维码</span>
                </div>
            </div>
            <img id="qrImage" class="hidden" alt="二维码">
        </div>

        <div class="tip">打开 <strong>微信</strong> → 扫一扫 → 确认登录</div>

        <div>
            <button class="btn btn-primary" id="btnGenerate" onclick="generateQrCode()">生成二维码</button>
            <button class="btn btn-outline" id="btnMockScan" onclick="mockScan()" disabled>模拟扫码（测试）</button>
        </div>

        <div id="statusArea"></div>
        <div class="countdown" id="countdown"></div>

        <div id="successBox" class="success-box hidden">
            <div class="label">✅ 登录成功</div>
            <div style="margin-top:8px;">
                <div class="label">用户ID</div>
                <div class="value" id="suid"></div>
                <div class="label">用户名</div>
                <div class="value" id="sname"></div>
                <div class="label">Token</div>
                <div class="value" id="stoken" style="font-size:12px;"></div>
            </div>
        </div>
    </div>

    <script>
        let currentScene = null, pollTimer = null, expireTimer = null, expireSeconds = 300;

        function $(id) { return document.getElementById(id); }

        function showStatus(type, msg) {
            const area = $('statusArea');
            area.innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
        }

        function hideStatus() { $('statusArea').innerHTML = ''; }

        async function generateQrCode() {
            clearTimers();
            $('successBox').classList.add('hidden');
            $('btnGenerate').disabled = true;
            showStatus('info', '正在获取二维码...');

            try {
                let resp = await fetch('/api/v1/auth/wechat/qrcode');
                if (!resp.ok) { let e = await resp.json(); throw new Error(e.message || '请求失败'); }
                let data = await resp.json();

                currentScene = data.scene;
                $('qrPlaceholder').classList.add('hidden');
                let img = $('qrImage');
                img.src = data.qrCodeUrl;
                img.classList.remove('hidden');
                img.onerror = () => showStatus('error', '二维码图片加载失败，请重试');

                $('btnMockScan').disabled = false;
                hideStatus();
                startPolling(currentScene);
                startExpireTimer(300);
            } catch (e) {
                showStatus('error', e.message);
                $('btnGenerate').disabled = false;
            }
        }

        async function mockScan() {
            if (!currentScene) return;
            $('btnMockScan').disabled = true;
            showStatus('info', '模拟扫码中...');

            try {
                let resp = await fetch('/api/v1/auth/wechat/mock-scan?scene=' + currentScene, { method: 'POST' });
                if (!resp.ok) { let e = await resp.json(); throw new Error(e.message || '模拟扫码失败'); }
                let data = await resp.json();
                showSuccess(data);
            } catch (e) {
                showStatus('error', e.message);
                $('btnMockScan').disabled = false;
            }
        }

        function startPolling(scene) {
            pollTimer = setInterval(async () => {
                try {
                    let resp = await fetch('/api/v1/auth/wechat/status?scene=' + scene);
                    if (!resp.ok) { clearTimers(); showStatus('error', '二维码已过期，请重新生成。'); resetButtons(); return; }
                    let data = await resp.json();
                    if (data.loggedIn) {
                        clearTimers();
                        showSuccess({ accessToken: data.accessToken, userId: data.userId, userName: data.userName });
                    }
                } catch (_) {}
            }, 1500);
        }

        function startExpireTimer(sec) {
            expireSeconds = sec;
            updateExpireDisplay();
            expireTimer = setInterval(() => {
                expireSeconds--;
                if (expireSeconds <= 0) { clearTimers(); showStatus('error', '二维码已过期，请重新生成。'); resetButtons(); return; }
                updateExpireDisplay();
            }, 1000);
        }

        function updateExpireDisplay() {
            $('countdown').textContent = expireSeconds > 0 ? expireSeconds + 's 后过期' : '';
        }

        function clearTimers() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            if (expireTimer) { clearInterval(expireTimer); expireTimer = null; }
            $('countdown').textContent = '';
        }

        function showSuccess(data) {
            clearTimers();
            hideStatus();
            $('btnGenerate').disabled = false;
            $('btnMockScan').disabled = true;
            $('suid').textContent = data.userId;
            $('sname').textContent = data.userName || '未知';
            $('stoken').textContent = data.accessToken;
            $('successBox').classList.remove('hidden');
            showStatus('success', '登录成功！欢迎 ' + (data.userName || ''));
        }

        function resetButtons() {
            $('btnGenerate').disabled = false;
            $('btnMockScan').disabled = true;
        }
    </script>
</body>
</html>
